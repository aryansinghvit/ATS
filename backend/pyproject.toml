[project]
name = "ats-backend"
version = "0.1.0"
description = "Enterprise AI-Native Applicant Tracking System — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "python-jose[cryptography]>=3.4.0",
    "httpx>=0.27",
    "fastembed>=0.4",
    "aioboto3>=13.0",
    "markdown-it-py>=3.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
