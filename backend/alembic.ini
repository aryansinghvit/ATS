# Alembic configuration for the ATS backend (async SQLAlchemy / asyncpg).
# The database URL is NOT stored here: env.py reads DATABASE_ADMIN_URL from app settings
# (override per-invocation with `alembic -x db_url=postgresql+asyncpg://... upgrade head`).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
